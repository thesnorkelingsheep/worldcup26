<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muirhead ISA Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
    --primary:#10b981;
    --primary-hover:#059669;
    --dark:#1e293b;
    --light:#f8fafc;
    --text:#334155;
    --border:#e2e8f0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:var(--light);
    color:var(--text);
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:0 auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid var(--border);
    padding-bottom:20px;
    margin-bottom:25px;
}

h1{
    margin:0;
    color:var(--dark);
    font-size:24px;
}

.btn{
    background-color:var(--dark);
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.btn:hover{
    background-color:#0f172a;
}

.view-section{
    display:none;
}

.view-section.active{
    display:block;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
}

th,td{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
}

th{
    background-color:#f1f5f9;
    color:var(--dark);
}

.rank{
    font-weight:bold;
    color:#64748b;
    width:50px;
}

.points{
    font-weight:bold;
    color:var(--primary);
    text-align:right;
    width:80px;
}

th.points-head{
    text-align:right;
}

#drop-zone{
    border:3px dashed #cbd5e1;
    border-radius:8px;
    padding:60px 20px;
    text-align:center;
    background:#f8fafc;
    cursor:pointer;
}

#drop-zone.dragover{
    background:#ecfdf5;
    border-color:var(--primary);
}

.status-msg{
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    display:none;
    font-weight:500;
}

.status-success{
    display:block;
    background-color:#d1fae5;
    color:#065f46;
}

.status-error{
    display:block;
    background-color:#fee2e2;
    color:#991b1b;
}

.loading{
    text-align:center;
    color:#64748b;
    padding:20px;
    font-style:italic;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1 id="page-title">Muirhead ISA Tracker</h1>

<button
class="btn"
id="toggle-view-btn"
onclick="toggleView()">
Switch to Admin View
</button>
</header>

<div id="leaderboard-view" class="view-section active">

<div id="loading" class="loading">
Fetching latest live standings...
</div>

<table id="league-table" style="display:none;">
<thead>
<tr>
<th class="rank">Pos</th>
<th>Name / Participant</th>
<th class="points-head">Total Points</th>
</tr>
</thead>

<tbody id="league-body"></tbody>

</table>
</div>

<div id="admin-view" class="view-section">

<p style="margin-top:0;color:#64748b;">
Drop your XLSX spreadsheet here and the leaderboard will update instantly.
</p>

<div
id="drop-zone"
ondragover="dragOverHandler(event)"
ondragleave="dragLeaveHandler(event)"
ondrop="dropHandler(event)"
onclick="document.getElementById('file-input').click()">

<p>Drag & Drop Excel File Here</p>

<span>or click to browse</span>

<input
type="file"
id="file-input"
accept=".xlsx,.xls,.csv"
style="display:none"
onchange="fileSelectHandler(event)">
</div>

<div id="status" class="status-msg"></div>

</div>
</div>

<script>

// SUPABASE CONFIG

const SUPABASE_URL =
'https://qdwbjrjsldufcvrndois.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_3snZWMy3jV-Hnm6BtOMmSA_sfGjFqpL';

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentView = 'leaderboard';

function toggleView(){

    const leaderboard =
    document.getElementById('leaderboard-view');

    const admin =
    document.getElementById('admin-view');

    const btn =
    document.getElementById('toggle-view-btn');

    const title =
    document.getElementById('page-title');

    if(currentView === 'leaderboard'){

        leaderboard.classList.remove('active');
        admin.classList.add('active');

        btn.innerText =
        'Back to Leaderboard';

        title.innerText =
        '⚙️ Admin Panel';

        currentView = 'admin';

    }else{

        admin.classList.remove('active');
        leaderboard.classList.add('active');

        btn.innerText =
        'Switch to Admin View';

        title.innerText =
        'Muirhead ISA Tracker';

        currentView = 'leaderboard';

        fetchAndRenderTable();
    }
}

function dragOverHandler(e){
    e.preventDefault();
    document.getElementById('drop-zone')
    .classList.add('dragover');
}

function dragLeaveHandler(e){
    e.preventDefault();
    document.getElementById('drop-zone')
    .classList.remove('dragover');
}

function dropHandler(e){
    e.preventDefault();

    document.getElementById('drop-zone')
    .classList.remove('dragover');

    if(e.dataTransfer.files.length > 0){
        processFile(e.dataTransfer.files[0]);
    }
}

function fileSelectHandler(e){

    if(e.target.files.length > 0){
        processFile(e.target.files[0]);
    }
}

async function processFile(file){

    showStatus(
    'Reading spreadsheet...',
    'success'
    );

    const reader = new FileReader();

    reader.onload = async function(e){

        try{

            const workbook =
            XLSX.read(
                e.target.result,
                { type:'array' }
            );

            const sheet =
            workbook.Sheets['Official chart']
            || workbook.Sheets[workbook.SheetNames[0]];

            if(!sheet){
                throw new Error(
                'Worksheet not found.'
                );
            }

            const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header:1,
                    defval:''
                }
            );

            const parsedData =
            parseExcelRows(rows);

            if(parsedData.length === 0){
                throw new Error(
                'No valid records found.'
                );
            }

            showStatus(
            `Found ${parsedData.length} records. Uploading...`,
            'success'
            );

            const { error: deleteError } =
            await supabaseClient
            .from('standings')
            .delete()
            .neq('id',0);

            if(deleteError)
                throw deleteError;

            const { error: insertError } =
            await supabaseClient
            .from('standings')
            .insert(parsedData);

            if(insertError)
                throw insertError;

            showStatus(
            `Success! ${parsedData.length} standings uploaded.`,
            'success'
            );

            fetchAndRenderTable();

        }
        catch(err){

            console.error(err);

            showStatus(
            `Database Error: ${err.message}`,
            'error'
            );
        }
    };

    reader.readAsArrayBuffer(file);
}

function parseExcelRows(rows){

    const standings = [];

    const NAME_COLUMN = 14;   // O
    const TOTAL_COLUMN = 28;  // AC

    for(let i = 3; i < rows.length; i++){

        const row = rows[i];

        const name =
        String(
            row[NAME_COLUMN] ?? ''
        ).trim();

        const points =
        Number(
            row[TOTAL_COLUMN]
        );

        if(
            name &&
            !isNaN(points)
        ){
            standings.push({
                name:name,
                points:points
            });
        }
    }

    return standings;
}

function showStatus(msg,type){

    const statusDiv =
    document.getElementById('status');

    statusDiv.innerText = msg;

    statusDiv.className =
    `status-msg status-${type}`;
}

async function fetchAndRenderTable(){

    document.getElementById('loading')
    .style.display = 'block';

    document.getElementById('league-table')
    .style.display = 'none';

    const { data,error } =
    await supabaseClient
    .from('standings')
    .select('*')
    .order('points',{
        ascending:false
    });

    if(error){

        console.error(error);

        document.getElementById('loading')
        .innerText =
        'Error syncing live leaderboard.';

        return;
    }

    const body =
    document.getElementById('league-body');

    body.innerHTML = '';

    if(!data || data.length === 0){

        body.innerHTML =
        `<tr>
            <td colspan="3" style="text-align:center;">
                No standings found.
            </td>
        </tr>`;

    }else{

        data.forEach((item,index)=>{

            const row =
            document.createElement('tr');

            row.innerHTML = `
                <td class="rank">${index+1}</td>
                <td>${escapeHTML(item.name)}</td>
                <td class="points">${item.points}</td>
            `;

            body.appendChild(row);
        });
    }

    document.getElementById('loading')
    .style.display = 'none';

    document.getElementById('league-table')
    .style.display = 'table';
}

function escapeHTML(str){

    return str.replace(
        /[&<>'"]/g,
        tag => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'
        }[tag] || tag)
    );
}

fetchAndRenderTable();

</script>

</body>
</html>
